<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wunschliste">
<meta name="theme-color" content="#0e1119">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<link rel="icon" id="favIcon" href="data:,">
<title>Wunschliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1119;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --text:#f5f5f7; --text-2:rgba(235,235,245,.62); --text-3:rgba(235,235,245,.38);
  --blue:#0a84ff; --purple:#bf5af2; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --gold:#ffd60a;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif","New York","Iowan Old Style",Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --blue-grad:linear-gradient(180deg,#2a8cff,#0a6cf0);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;-webkit-text-size-adjust:100%;background:#0d1018;min-height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;letter-spacing:-.01em;overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button,a,.tab,.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{font:inherit;color:inherit;font-size:16px}
.i{display:block;flex:none}
[data-icon]{display:inline-flex}
[hidden]{display:none!important}

.bg{position:fixed;top:-80px;left:0;right:0;bottom:-160px;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 520px at 10% -8%,rgba(10,132,255,.20),transparent 60%),
  radial-gradient(700px 480px at 95% 4%,rgba(191,90,242,.13),transparent 60%),
  radial-gradient(1000px 600px at 50% 112%,rgba(94,92,230,.24),transparent 60%),
  linear-gradient(180deg,#131826 0%,#0d1018 100%)}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 15%,transparent 65%);mask-image:radial-gradient(ellipse at 50% 0%,#000 15%,transparent 65%)}

.glass{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -24px rgba(0,0,0,.7);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%)}
.glass-strong{background:rgba(38,42,56,.6);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 18px 40px -12px rgba(0,0,0,.75);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%)}
.mdot{width:7px;height:7px;border-radius:50%;background:var(--c,#fff);box-shadow:0 0 10px var(--c,transparent);flex:none}

/* ---------- Top-Leiste ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.topbar::before{content:"";position:absolute;inset:0 0 -18px;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s;background:linear-gradient(180deg,rgba(13,16,24,.92) 0%,rgba(13,16,24,.7) 70%,rgba(13,16,24,0) 100%);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
.topbar.scrolled::before{opacity:1}
.topbar-title{font-size:16px;font-weight:600;opacity:0;transform:translateY(4px);transition:.25s var(--ease)}
.topbar.scrolled .topbar-title{opacity:1;transform:none}
.round-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;color:#fff;background:linear-gradient(180deg,rgba(72,77,96,.95),rgba(48,52,68,.95));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 16px -6px rgba(0,0,0,.7);transition:transform .15s}
.round-btn:active{transform:scale(.9)}
.round-btn.blue{background:var(--blue-grad);border-color:transparent;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px -6px rgba(10,132,255,.8)}
.badge-dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange);display:none}
.round-btn.dirty .badge-dot{display:block}

/* ---------- Layout ---------- */
#app{padding:calc(58px + env(safe-area-inset-top)) 0 calc(118px + env(safe-area-inset-bottom))}
.page{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left));animation:fade .32s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.large-title{font-family:var(--serif);font-style:italic;font-weight:400;font-size:46px;line-height:1.02;letter-spacing:-.005em;margin:8px 2px 12px}
.lead{color:var(--text-2);font-size:15px;line-height:1.45;margin:0 2px 18px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:24px 6px 10px}
.section-title b{color:var(--text-2);font-weight:600;text-transform:none;letter-spacing:0;font-size:13.5px}
.foot-note{font-size:12.5px;color:var(--text-3);text-align:center;margin:22px 10px 0;line-height:1.5}
.sub{font-size:12.5px;color:var(--text-3);display:inline-flex;align-items:center;gap:4px}
.preview-banner{max-width:680px;margin:0 auto 10px;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.4;color:#ffd58a;background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.25)}

/* ---------- Segment-Schalter ---------- */
.seg{display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06)}
.seg button{flex:1;min-width:0;height:36px;padding:0 8px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--text-2);transition:.25s var(--ease);white-space:nowrap}
.seg button.active{background:rgba(255,255,255,.15);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.3)}
.seg .n{font-size:11.5px;color:var(--text-3);font-weight:500;font-variant-numeric:tabular-nums}
.seg.small{flex:none}
.seg.small button{height:28px;font-size:12.5px;padding:0 12px;flex:none}

/* ---------- Übersicht Wünsche ---------- */
.summary{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 4px 4px}
.summary .sum{font-size:12.5px;color:var(--text-3)}
.summary .sum b{display:block;font-size:26px;color:var(--text);font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.pill-btn{height:34px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);white-space:nowrap;flex:none;transition:transform .15s}
.pill-btn:active{transform:scale(.95)}
.pill-btn[disabled]{opacity:.75;font-variant-numeric:tabular-nums}
.check-info{font-size:12px;color:var(--text-3);margin:4px 4px 16px}
.hit-banner{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;margin:0 0 14px;background:rgba(48,209,88,.12);border:1px solid rgba(48,209,88,.3);color:#86ec9f;font-size:14px;font-weight:600;text-align:left}

/* ---------- Listen & Karten ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.swipe{position:relative;border-radius:20px}
.swipe-bg{position:absolute;inset:1px;border-radius:19px;display:flex;align-items:center;padding:0 22px;gap:8px;font-size:14px;font-weight:650;color:#fff;opacity:0;transition:opacity .15s}
.swipe-bg.left{justify-content:flex-start;background:linear-gradient(90deg,#28b84c,rgba(48,209,88,.3))}
.swipe-bg.right{justify-content:flex-end;background:linear-gradient(270deg,#e5352b,rgba(255,69,58,.3))}
.swipe.back .swipe-bg.left{background:linear-gradient(90deg,#0a74e0,rgba(10,132,255,.3))}
.swipe.swiping[data-dir=right] .swipe-bg.left,.swipe.swiping[data-dir=left] .swipe-bg.right{opacity:.5}
.swipe.armed[data-dir=right] .swipe-bg.left,.swipe.armed[data-dir=left] .swipe-bg.right{opacity:1}
.swipe-bg .i{transition:transform .2s var(--ease)}
.swipe.armed .swipe-bg .i{transform:scale(1.3)}

.card{position:relative;display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:13px;align-items:center;padding:10px 12px 10px 10px;border-radius:20px;background:linear-gradient(180deg,#262a38,#1d202c);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px -18px rgba(0,0,0,.8);transition:transform .3s var(--ease),border-color .25s;touch-action:pan-y;cursor:pointer;animation:in .4s var(--ease) both;will-change:transform}
.card:active{transform:scale(.985)}
.card.hit{border-color:rgba(48,209,88,.45);box-shadow:0 0 0 1px rgba(48,209,88,.2),0 10px 30px -18px rgba(0,0,0,.8)}
.card.loading{cursor:default}
@keyframes in{from{opacity:0;transform:translateY(6px) scale(.985)}}
@media (hover:hover){.card:hover{border-color:var(--line-2)}}

.media{position:relative;width:76px;height:76px;border-radius:14px;background:#fff;overflow:hidden;display:grid;place-items:center;flex:none}
.media>img{width:100%;height:100%;object-fit:contain;padding:7px;-webkit-user-drag:none}
.media .fallback{display:none;flex-direction:column;align-items:center;gap:5px;color:rgba(235,235,245,.72);font-size:10px;font-weight:600;text-align:center;padding:4px}
.media.noimg{background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08)}
.media.noimg .fallback{display:flex}
.media.sm{width:48px;height:48px;border-radius:11px}
.media.sm>img{padding:4px}
.media.sm .fallback span{display:none}
.media.big{width:100%;height:auto;aspect-ratio:1;border-radius:16px}
.media.big>img{padding:14px}
.media.big .fallback{font-size:12px;gap:8px}
.card-body{min-width:0}
.site{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:650;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;min-width:0}
.site span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site img.fav{display:none;width:14px;height:14px;border-radius:3px;flex:none;object-fit:contain}
.title{margin-top:3px;font-size:15px;font-weight:600;line-height:1.28;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.meta-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px 8px;margin-top:6px}
.price{font-size:16px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.price.muted{font-size:13px;color:var(--text-3);font-weight:500}
.chg{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:650;padding:2px 7px 2px 5px;border-radius:999px;white-space:nowrap}
.chg.down{color:#86ec9f;background:rgba(48,209,88,.15)}
.chg.up{color:#ff9a90;background:rgba(255,69,58,.15)}
.tgt{font-size:11px;font-weight:650;color:var(--text-3);padding:2px 7px;border-radius:999px;border:1px solid var(--line-2);white-space:nowrap}
.tgt.hit{color:#86ec9f;border-color:rgba(48,209,88,.4);background:rgba(48,209,88,.1)}
.shop-round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--blue-grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 16px -6px rgba(10,132,255,.9);text-decoration:none;transition:transform .15s}
.shop-round:active{transform:scale(.88)}
.chev{color:var(--text-3)}

/* Vergleichs-Stapel */
.stack{position:relative;width:76px;height:76px}
.stack .media{position:absolute;width:60px;height:60px;border-radius:13px;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.stack .media>img{padding:5px}
.stack .media .fallback span{display:none}
.stack .st0{left:0;top:16px}
.stack .st1{left:8px;top:8px;opacity:.9}
.stack .st2{left:16px;top:0;opacity:.75}
.gtag{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;color:#6cb4ff;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden}

.sk{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite linear;border-radius:8px}
.media.sk{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%}
@keyframes shimmer{to{background-position:-200% 0}}
.loading-label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);margin-top:9px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--text-2);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 26px;border-radius:24px;border:1.5px dashed rgba(255,255,255,.1);color:var(--text-3);font-size:14px;line-height:1.5}
.empty .i{color:var(--text-2);opacity:.85}
.empty h3{color:var(--text);font-size:17px;font-weight:600}
.empty b{color:var(--text-2)}

.mini{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:left;cursor:pointer}
.mini:active{background:rgba(255,255,255,.09)}
.mini>.i{color:var(--blue);margin:0 6px}
.mini .card-body{flex:1}
.mini .title{margin:0;font-size:14.5px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:rgba(255,255,255,.07);border:1px solid var(--line);flex:none}
.icon-btn.sm{width:32px;height:32px}
.icon-btn:active{background:rgba(255,255,255,.14)}
.disclosure{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 6px 10px;color:var(--text-2);font-size:14px;font-weight:600;margin-top:10px}
.disclosure .i{transition:transform .25s var(--ease)}
.disclosure.open .i{transform:rotate(180deg)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 4px}
.stat{padding:14px 16px;border-radius:20px}
.stat span{font-size:12.5px;color:var(--text-3)}
.stat b{display:block;font-size:23px;font-weight:650;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* Notizen */
.notes-list{display:flex;flex-direction:column;gap:10px}
.note{border-radius:20px;padding:14px 16px 8px;display:flex;flex-direction:column;animation:in .4s var(--ease) both}
.note:focus-within{border-color:rgba(10,132,255,.45)}
.note textarea{width:100%;background:none;border:0;outline:0;resize:none;line-height:1.5;color:var(--text);min-height:26px;overflow:hidden}
.note textarea::placeholder{color:var(--text-3)}
.note footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11.5px;color:var(--text-3)}

/* Suche */
.search-field{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:999px;margin:0 0 8px;color:var(--text-3)}
.search-field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;color:var(--text)}
.search-field input::placeholder{color:var(--text-3)}
.search-field input::-webkit-search-cancel-button{-webkit-appearance:none}

/* ---------- Tab-Leiste ---------- */
.tabbar-wrap{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;display:flex;justify-content:center;gap:10px;padding:0 max(14px,env(safe-area-inset-left));pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
body.kb .tabbar-wrap{opacity:0;transform:translateY(24px)}
body.kb .tabbar-wrap *{pointer-events:none!important}
.tabbar{pointer-events:auto;display:flex;align-items:center;padding:5px;border-radius:999px;gap:2px;flex:1;max-width:420px;height:66px}
.tab{flex:1;min-width:0;height:56px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--text-2);position:relative;transition:color .2s,background .3s var(--ease),transform .15s}
.tab:active{transform:scale(.93)}
.tab.active{color:#3d9bff;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.tab-search{pointer-events:auto;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);flex:none;transition:transform .15s,color .2s}
.tab-search:active{transform:scale(.92)}
.tab-search.active{color:#3d9bff}

/* ---------- Sheets ---------- */
.sheet-layer{position:fixed;inset:0;z-index:70}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .35s}
.sheet-layer.open .sheet-backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;max-height:calc(100% - env(safe-area-inset-top) - 14px);display:flex;flex-direction:column;background:rgba(26,29,40,.95);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.1);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1)}
.sheet.tall{height:calc(100% - env(safe-area-inset-top) - 14px)}
.sheet-layer.open .sheet{transform:none}
.sheet-grab{padding:8px 0 0;display:flex;justify-content:center;touch-action:none;cursor:grab}
.sheet-grab span{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 12px 10px;touch-action:none}
.sheet-head h2{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
.sh-left{justify-self:start}
.sh-right{justify-self:end}
.sh-btn{height:36px;padding:0 12px;border-radius:999px;font-size:16px;color:#3d9bff;font-weight:500}
.sh-btn.strong{font-weight:650}
.sh-btn:active{background:rgba(255,255,255,.08)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(28px + env(safe-area-inset-bottom))}

/* iOS-Listen */
.glist{border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--line);overflow:hidden}
.glist>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;width:100%;font-size:16px;text-align:left;color:var(--text)}
button.row:active{background:rgba(255,255,255,.07)}
.row .lbl{flex:1;min-width:0}
.row .i{color:var(--text-2)}
.row>.i:first-child{color:#3d9bff}
.row.danger,.row.danger .i{color:var(--red)!important}
.row input{flex:1;min-width:0;text-align:right;background:none;border:0;outline:0;color:var(--text)}
.row input::placeholder{color:var(--text-3)}
.row input[type=date]{text-align:right;min-height:30px;-webkit-appearance:none;appearance:none;color:#3d9bff}
.glist textarea{display:block;width:100%;background:none;border:0;outline:0;resize:none;line-height:1.45;padding:14px 16px;min-height:84px;color:var(--text)}
.glist input.full{display:block;width:100%;height:50px;padding:0 16px;background:none;border:0;outline:0;color:var(--text)}
.glist textarea::placeholder,.glist input.full::placeholder{color:var(--text-3)}

/* Detail */
.hero-wrap{position:relative}
.hero{position:relative;width:100%;aspect-ratio:4/3;max-height:340px;border-radius:22px;background:#fff;overflow:hidden;display:grid;place-items:center}
.hero>img{width:100%;height:100%;object-fit:contain;padding:18px}
.hero .fallback{display:none;flex-direction:column;align-items:center;gap:10px;color:rgba(235,235,245,.7);font-size:13px;font-weight:600}
.hero.noimg{background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px dashed rgba(255,255,255,.16)}
.hero.noimg .fallback{display:flex}
.hero-edit{position:absolute;right:10px;bottom:10px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px}
.d-site{margin-top:16px}
.d-title{display:block;width:100%;background:none;border:0;outline:0;resize:none;font-size:22px!important;font-weight:650;letter-spacing:-.02em;line-height:1.25;color:var(--text);margin-top:4px;overflow:hidden;padding:0}
.d-price{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.d-price .price{font-size:26px}
.btn-lg{height:52px;border-radius:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16.5px;font-weight:650;color:#fff;background:var(--blue-grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px -10px rgba(10,132,255,.9);text-decoration:none;margin-top:16px;transition:transform .15s}
.btn-lg:active{transform:scale(.98)}
.btn-lg.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);box-shadow:none;color:var(--text);margin-top:12px}
.btn-lg.gold{background:linear-gradient(180deg,#ffdc3a,#f0b400);color:#241a00;box-shadow:0 10px 24px -12px rgba(255,204,0,.8);margin-top:10px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.quick.two{grid-template-columns:repeat(2,1fr)}
.quick button{height:66px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line)}
.quick button:active{background:rgba(255,255,255,.13)}
.quick .i{color:#3d9bff}

/* Vergleich */
.g-title{display:block;width:100%;background:none;border:0;outline:0;font-family:var(--serif);font-style:italic;font-size:36px!important;color:var(--text);padding:0;line-height:1.1}
.g-meta{font-size:13.5px;color:var(--text-3);margin:4px 0 14px}
.sort-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;font-size:13px;color:var(--text-3)}
.cmp-scroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 0;padding:4px 16px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding:0 16px}
.cmp-scroll::-webkit-scrollbar{display:none}
.cmp-card{flex:0 0 76%;max-width:290px;scroll-snap-align:start;border-radius:22px;padding:10px 10px 12px;background:linear-gradient(180deg,#2b2f3e,#1f2230);border:1px solid var(--line);position:relative;display:flex;flex-direction:column}
.cmp-card.fav{border-color:rgba(255,214,10,.6);box-shadow:0 0 0 1px rgba(255,214,10,.25),0 18px 40px -22px rgba(255,214,10,.5)}
.star{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s}
.star:active{transform:scale(.88)}
.star.on{color:var(--gold)}
.cmp-card .body{padding:12px 4px 0;flex:1;display:flex;flex-direction:column}
.cmp-card h3{font-size:15px;font-weight:600;line-height:1.3;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.diff{font-size:12.5px;color:var(--text-3);font-weight:600;margin-top:4px}
.diff.best{color:#86ec9f}
.cmp-note{font-size:13px;color:var(--text-2);margin-top:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cmp-actions{display:flex;gap:8px;margin-top:auto;padding-top:14px}
.cmp-actions a,.cmp-actions button{flex:1;height:40px;border-radius:12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.cmp-actions a{color:#fff;background:var(--blue-grad);text-decoration:none}
.cmp-actions button{background:rgba(255,255,255,.08);border:1px solid var(--line)}
.link-danger{display:block;margin:16px auto 0;color:var(--red);font-size:15px;font-weight:500;padding:10px 16px}

/* Hinzufügen */
.paste-big{width:100%;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16.5px;font-weight:650;color:#fff;background:var(--blue-grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 28px -12px rgba(10,132,255,.9);transition:transform .15s}
.paste-big:active{transform:scale(.98)}
.hint-sm{text-align:center;font-size:12.5px;color:var(--text-3);margin-top:8px}
.or{text-align:center;font-size:11.5px;color:var(--text-3);margin:20px 0 12px;text-transform:uppercase;letter-spacing:.1em}
.field-pill{display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid var(--line);margin-top:12px}
.field-pill:focus-within{border-color:rgba(10,132,255,.6)}
.field-pill input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
.field-pill input::placeholder{color:var(--text-3)}
.pick{display:flex;flex-direction:column;gap:8px}
.set-status{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:18px;font-size:14.5px;color:var(--text-2)}
.set-status .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.set-status.dirty .dot{background:var(--orange);box-shadow:0 0 10px var(--orange)}

/* ---------- Dialog (zentriert) ---------- */
#overlay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(5,7,12,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .2s}
#overlay.open{opacity:1;pointer-events:auto}
.modal{width:min(360px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:28px;padding:24px 22px 20px;background:rgba(34,38,52,.94);transform:scale(.94);transition:transform .25s var(--ease)}
#overlay.open .modal{transform:none}
.modal.wide{width:min(540px,100%)}
.modal h3{font-size:18px;font-weight:650;letter-spacing:-.02em;text-align:center}
.modal .txt{color:var(--text-2);font-size:14px;margin-top:8px;line-height:1.5;text-align:center}
.modal.wide h3,.modal.wide .txt{text-align:left}
.modal .acts{display:flex;gap:10px;margin-top:22px}
.modal .acts.stack{flex-direction:column-reverse}
.modal .acts .btn{flex:1;height:46px;justify-content:center;font-size:15.5px}
.btn{height:40px;padding:0 16px;border-radius:14px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid var(--line)}
.btn-blue{background:var(--blue-grad);color:#fff}
.btn-danger{background:linear-gradient(180deg,#ff5046,#dc2419);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:12.5px;color:var(--text-2);padding-left:4px}
.field input{height:46px;padding:0 14px;border-radius:13px;background:rgba(0,0,0,.28);border:1px solid var(--line);outline:0;-webkit-appearance:none;appearance:none}
.field input:focus{border-color:rgba(10,132,255,.6)}
.steps{margin:14px 0 0 20px;display:flex;flex-direction:column;gap:9px;font-size:14px;color:var(--text-2);line-height:1.45}
.steps b{color:var(--text)}
.drop-hint{font-size:12.5px;color:var(--text-3);line-height:1.5}
kbd{font-family:var(--sans);font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--text-2)}

/* ---------- Toasts ---------- */
#toasts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 28px)}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;font-size:14px;line-height:1.3;background:rgba(44,48,62,.94);border:1px solid var(--line-2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 16px 40px -12px rgba(0,0,0,.7);animation:toastIn .35s var(--ease);transition:opacity .3s,transform .3s}
.toast .i{color:var(--green)}
.toast.out{opacity:0;transform:translateY(8px)}
.toast-act{color:#3d9bff;font-weight:650;margin-left:2px;white-space:nowrap;padding:4px 0}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}}

@media (min-width:760px){.large-title{font-size:52px}}
</style>
</head>
<body>
<div class="bg"></div>

<header class="topbar" id="topbar">
  <button class="round-btn" id="gearBtn" aria-label="Einstellungen"><span data-icon="gear" data-size="19"></span><span class="badge-dot"></span></button>
  <div class="topbar-title" id="topTitle">Wünsche</div>
  <button class="round-btn blue" id="addBtn" aria-label="Hinzufügen"><span data-icon="plus" data-size="20"></span></button>
</header>

<main id="app"><div id="bannerSlot"></div><div id="view"></div></main>

<nav class="tabbar-wrap" id="tabbar" aria-label="Bereiche">
  <div class="tabbar glass-strong">
    <button class="tab active" data-tab="wishes"><span data-icon="gift" data-size="22"></span><span>Wünsche</span></button>
    <button class="tab" data-tab="compare"><span data-icon="columns" data-size="22"></span><span>Vergleiche</span><span class="badge" id="compareBadge" hidden></span></button>
    <button class="tab" data-tab="bought"><span data-icon="bagCheck" data-size="22"></span><span>Gekauft</span></button>
    <button class="tab" data-tab="notes"><span data-icon="note" data-size="22"></span><span>Notizen</span></button>
  </div>
  <button class="tab-search glass-strong" data-tab="search" aria-label="Suche"><span data-icon="search" data-size="22"></span></button>
</nav>

<div id="sheetRoot"></div>
<div id="overlay"></div>
<div id="toasts"></div>

function modal({ title, text = '', body = '', actions, wide = false, stack = false, onOpen, collect }) {
  return new Promise(resolve => {
    const ov = $('#overlay');
    ov.innerHTML = `<div class="modal glass ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3>${text ? `<p class="txt">${esc(text)}</p>` : ''}${body}
      <div class="acts ${stack || actions.length > 2 ? 'stack' : ''}">${actions.map((a, i) => `<button class="btn ${a.cls || 'btn-ghost'}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
    const m = ov.firstElementChild;
    requestAnimationFrame(() => ov.classList.add('open'));
    let finished = false;
    const done = v => {
      if (finished) return; finished = true;
      const data = v && collect ? collect(m) : null;
      ov.classList.remove('open');
      document.removeEventListener('keydown', key, true);
      ov.onclick = null;
      setTimeout(() => { if (!ov.classList.contains('open')) ov.innerHTML = ''; }, 220);
      resolve(collect ? { value: v, data } : v);
    };
    const key = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
      else if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); done(actions[actions.length - 1].value); }
    };
    document.addEventListener('keydown', key, true);
    ov.onclick = e => {
      if (e.target === ov) return done(false);
      const b = e.target.closest('.acts button');
      if (b) done(actions[+b.dataset.i].value);
    };
    onOpen && onOpen(m, done);
    if (!IS_TOUCH) setTimeout(() => { const f = m.querySelector('input:not([type=file]):not([type=date])'); (f || m.querySelector('.acts .btn:last-child')).focus(); }, 60);
  });
}

function sheet(o) {

  $('#sheetRoot').appendChild(layer);

  }

  let y0 = null, dy = 0;
  const grabZone = [layer.querySelector('.sheet-grab'), layer.querySelector('.sheet-head')];
  grabZone.forEach(z => z.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;

}

async function shareFile(content, name, type) {

  const file = new File([content], name, { type });
  if (!navigator.canShare({ files: [file] })) return false;

  catch (e) { return e && e.name === 'AbortError' ? 'abort' : false; }
}
async function save(forcePicker = false) {

    try {

          suggestedName: fileName(),

function brandFromHost(url) {
  const h = hostOf(url).split('.');
  let label = h.length >= 2 ? h[h.length - 2] : h[0] || '';
  if (/^(co|com)$/.test(label) && h.length >= 3) label = h[h.length - 3];
  if (!label) return '';
  return label.length <= 3 ? label.toUpperCase() : label[0].toUpperCase() + label.slice(1);
}
function cleanSite(site, url) {
  if (!site) return brandFromHost(url);
  const s = site.trim().replace(/\s+(de|at|ch|deutschland|germany|österreich|schweiz)$/i, '');
  if (/^(www\.)?[\w-]+\.[a-z.]{2,}$/i.test(s)) return brandFromHost('https://' + s.replace(/^www\./, ''));
  return s;

/* Preis aus Fließtext, z. B. „Current price: 259,90 €“ */
function priceFromText(text) {
  if (!text) return null;
  text = text.slice(0, 300000).replace(/[\u00a0\u202f]/g, ' ');
  const NUM = "(\\d{1,3}(?:[.,\\s']\\d{3})*(?:[.,]\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)";
  const C = '(€|eur\\b|\\$|usd\\b|£|gbp\\b|chf\\b)';
  const K = '(?:preis|price|jetzt|nur|current|angebot|sale)[^\\d€$£\\n]{0,40}';
  const res = [new RegExp(K + NUM + '\\s?' + C, 'i'), new RegExp(K + C + '\\s?' + NUM, 'i')];
  for (let i = 0; i < res.length; i++) {
    const m = text.match(res[i]); if (!m) continue;
    const num = i % 2 === 0 ? m[1] : m[2], cur = i % 2 === 0 ? m[2] : m[1];
    const p = parsePrice(num);
    if (p && p > 0 && p < 1e6) return { price: p, currency: CUR[cur.toLowerCase()] || 'EUR' };
  }
  return null;
}

function parseHTML(html, base) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const meta = (...names) => {
    for (const n of names) {
      const el = doc.querySelector(`meta[property="${n}"],meta[name="${n}"],meta[itemprop="${n}"]`);
      if (el && el.content && el.content.trim()) return el.content.trim();
    }
    return null;
  };
  const out = { title: null, image: null, price: null, currency: null, site: null, logo: null };
  const products = [];
  const walk = o => {
    if (!o || typeof o !== 'object') return;
    if (Array.isArray(o)) return o.forEach(walk);
    const t = [].concat(o['@type'] || []);
    if (t.includes('Product') || t.includes('ProductGroup') || t.includes('IndividualProduct')) products.push(o);
    if (o['@graph']) walk(o['@graph']);
    if (o.mainEntity) walk(o.mainEntity);
    if (o.itemListElement) walk(o.itemListElement);
  };
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(s => { try { walk(JSON.parse(s.textContent)); } catch {} });
  const p = products[0];
  if (p) {
    out.title = typeof p.name === 'string' ? p.name : null;
    let img = p.image;
    if (Array.isArray(img)) img = img[0];
    if (img && typeof img === 'object') img = img.url || img.contentUrl;
    if (typeof img === 'string') out.image = img;
    let offers = p.offers || (Array.isArray(p.hasVariant) && p.hasVariant[0] && p.hasVariant[0].offers);
    if (Array.isArray(offers)) offers = offers[0];
    if (offers && offers.offers) { let o2 = offers.offers; if (Array.isArray(o2)) o2 = o2[0]; if (o2) offers = { ...offers, ...o2 }; }
    if (offers) {
      const spec = Array.isArray(offers.priceSpecification) ? offers.priceSpecification[0] : offers.priceSpecification;
      out.price = offers.price ?? offers.lowPrice ?? (spec && spec.price) ?? null;
      out.currency = offers.priceCurrency || (spec && spec.priceCurrency) || null;
    }
    if (p.brand) out.brand = typeof p.brand === 'string' ? p.brand : p.brand.name;

/* ---------- Eigene Bilder (Einfügen / Ziehen) ---------- */
function imageToDataURL(file, max = 900) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
/* Muss synchron starten, da DataTransfer nach einem await leer ist */
function imageFromTransfer(dt) {
  if (!dt) return Promise.resolve(null);
  const f = [...(dt.files || [])].find(x => x.type.startsWith('image/'));
  const html = dt.getData ? dt.getData('text/html') : '';
  const uriList = dt.getData ? (dt.getData('text/uri-list') || dt.getData('text/plain') || '') : '';
  if (f) return imageToDataURL(f).catch(() => null);
  if (html) {
    const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (m && /^https?:/i.test(m[1])) return Promise.resolve(m[1].replace(/&amp;/g, '&'));
  }
  const uri = uriList.split(/\r?\n/).map(s => s.trim()).find(s => /^https?:/i.test(s));
  return Promise.resolve(uri || null);
}
const hasExternal = dt => dt && [...(dt.types || [])].some(t => t === 'Files' || t === 'text/uri-list' || t === 'text/html');

function copy(text, msg = 'Link kopiert') {
  const done = () => toast(msg, { icon: 'check' });
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(fallback); else fallback();
  function fallback() {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch {} t.remove();
  }
}

/* ---------- Toast ---------- */
function toast(msg, opt = {}) {
  const box = $('#toasts');
  if (opt.tag) $$('.toast', box).forEach(x => { if (x.dataset.tag === opt.tag) x.remove(); });
  while (box.children.length > 1) box.firstChild.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  if (opt.tag) t.dataset.tag = opt.tag;
  t.innerHTML = `${opt.icon ? icon(opt.icon, 16) : ''}<span>${esc(msg)}</span>${opt.action ? `<button class="toast-act">${esc(opt.action.label)}</button>` : ''}`;
  const kill = () => { t.classList.add('out'); setTimeout(() => t.remove(), 300); };
  if (opt.action) { t.style.pointerEvents = 'auto'; t.querySelector('button').onclick = () => { opt.action.run(); kill(); }; }
  box.appendChild(t);
  setTimeout(kill, opt.duration || (opt.action ? 5500 : 2800));
}

const SWIPE_T = 96;
function bindSwipes(root) {
  $$('.swipe[data-mode]', root).forEach(sw => {
    const card = sw.querySelector('.card');
    if (!card || card.classList.contains('loading')) return;
    let x0 = 0, y0 = 0, dx = 0, pid = null, axis = null;
    card.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest('a,button')) return;
      x0 = e.clientX; y0 = e.clientY; dx = 0; pid = e.pointerId; axis = null;
    });
    card.addEventListener('pointermove', e => {
      if (pid !== e.pointerId) return;

      if (Math.abs(dx) > SWIPE_T) {

async function readClipboardImage() {

  const items = await navigator.clipboard.read();
  for (const ci of items) {
    const t = ci.types.find(x => x.startsWith('image/'));
    if (t) { const blob = await ci.getType(t); return imageToDataURL(new File([blob], 'bild', { type: t })); }
    if (ci.types.includes('text/plain')) {
      const u = (await (await ci.getType('text/plain')).text()).trim();
      if (/^https?:\/\/\S+$/i.test(u)) return u;
    }
  }
  throw new Error('kein Bild');
}

}

/* ---------- Hinzufügen ---------- */
let addRef = null;
async function pasteFromClipboard(ctx = {}) {
  let t = '';
  try { t = ((await navigator.clipboard.readText()) || '').trim(); }
  catch { toast('Einfügen nicht erlaubt – tippe lange ins Eingabefeld → „Einsetzen“', { duration: 5000 }); return false; }
  if (!t) { toast('Die Zwischenablage ist leer'); return false; }
  if (t.startsWith('WUNSCHLISTE:')) { applyGrab(t, ctx); return true; }
  if (looksUrl(t)) { const u = normalizeUrl(t); if (u) { addLink(u, ctx); return true; } }
  return t;
}
function openAdd(ctx = {}) {
  const g = ctx.groupId && groupById(ctx.groupId);
  let mode = 'link', pri = ui.tab === 'wishes' ? ui.seg : 'next';
  const body = `
    <button class="paste-big" id="aPaste">${icon('clipboard', 20)}Aus Zwischenablage einfügen</button>
    <p class="hint-sm">Kopierter Link oder Daten vom Kurzbefehl „Zur Wunschliste“</p>
    <div class="or">oder eintippen</div>
    ${g ? `<p class="lead" style="margin:0 2px">Neue Option für „${esc(g.title)}“</p>` : `<div class="seg" id="aMode"><button data-mode="link" class="active">${icon('link', 15)}Link</button><button data-mode="note">${icon('note', 15)}Notiz</button></div>`}
    <div class="field-pill"><input id="aInput" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="https://…"></div>
    ${g ? '' : `<div id="aPriWrap"><div class="section-title"><span>Einordnen als</span></div><div class="seg" id="aPri">${priSegHTML(pri)}</div></div>`}`;
  const api = sheet({
    title: g ? 'Option hinzufügen' : 'Hinzufügen', left: 'Abbrechen', right: 'Hinzufügen', body,
    onRight: () => submit(),
    onOpen: a => {
      const inp = a.body.querySelector('#aInput');
      const setMode = m => {
        mode = m;
        $$('#aMode button', a.body).forEach(x => x.classList.toggle('active', x.dataset.mode === m));
        inp.type = m === 'link' ? 'url' : 'text';
        inp.setAttribute('inputmode', m === 'link' ? 'url' : 'text');
        inp.placeholder = m === 'link' ? 'https://…' : 'Kurze Notiz …';
        const w = a.body.querySelector('#aPriWrap'); if (w) w.hidden = m !== 'link';
      };
      a.body.addEventListener('click', async e => {
        if (e.target.closest('#aPaste')) {
          const r = await pasteFromClipboard({ priority: pri, groupId: ctx.groupId });
          if (r === true) api.close();
          else if (typeof r === 'string') { inp.value = r; if (!g) setMode('note'); }
          return;
        }
        const mb = e.target.closest('#aMode button'); if (mb) { setMode(mb.dataset.mode); return; }
        const pb = e.target.closest('#aPri button'); if (pb) { pri = pb.dataset.pri; $$('#aPri button', a.body).forEach(x => x.classList.toggle('active', x === pb)); }
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      inp.addEventListener('input', () => { if (!g && mode === 'note' && looksUrl(inp.value.trim())) setMode('link'); });
      if (!IS_TOUCH) setTimeout(() => inp.focus(), 300);
    },
    onClose: () => { addRef = null; }
  });
  addRef = { api, ctx: { ...ctx, get priority() { return pri; } } };
  function submit() {
    const v = api.body.querySelector('#aInput').value.trim();
    if (!v) { toast(mode === 'link' ? 'Füge einen Link ein' : 'Schreib eine Notiz'); return; }
    if (mode === 'link') {
      const u = normalizeUrl(v);
      if (!u || /\s/.test(v)) { toast('Das ist kein gültiger Link'); return; }
      api.close(); addLink(u, { priority: pri, groupId: ctx.groupId });
    } else { api.close(); addNote(v); }
  }
}
function addLink(url, ctx = {}) {
  const ex = state.items.find(i => canonUrl(i.url) === canonUrl(url) && i.status !== 'discarded');
  if (ex) { toast(ex.status === 'bought' ? 'Das hast du schon gekauft' : 'Ist schon in deinen Wünschen', { action: { label: 'Anzeigen', run: () => openItem(ex) } }); return; }
  const g = ctx.groupId && groupById(ctx.groupId);
  const it = { id: uid(), type: 'link', url, title: '', image: '', price: null, currency: 'EUR', site: '', note: '', priority: g ? g.priority : (ctx.priority || 'next'), status: 'wish', groupId: g ? g.id : null, createdAt: Date.now(), loading: true };
  state.items.unshift(it);
  markDirty();
  if (!g) { ui.tab = 'wishes'; ui.seg = it.priority; scrollTo(0, 0); }
  loadMeta(it, false, true);
}
async function loadMeta(it, force = false, isNew = false) {
  it.loading = true;
  renderView(true); refreshGroupSheet();
  let meta = {};
  try { meta = await fetchMeta(it.url); } catch {}
  it.loading = false;
  if (!state.items.includes(it)) return;
  const set = (k, v) => { if (v != null && v !== '' && (force || it[k] == null || it[k] === '')) it[k] = v; };
  const wasGuess = it.titleGuessed || !it.title || it.title === guessFromUrl(it.url) || isBadTitle(it.title);
  if (meta.title && !meta.guessed && (force || wasGuess)) { it.title = meta.title; it.titleGuessed = false; }
  else if (meta.title && meta.guessed && (!it.title || isBadTitle(it.title))) { it.title = meta.title; it.titleGuessed = true; }
  set('image', meta.image); set('imageOrig', meta.imageOrig); set('site', meta.site); set('logo', meta.logo);
  if (meta.price != null && (force || it.price == null)) {
    if (it.price != null && Math.abs(meta.price - it.price) >= 0.01) it.lastPrice = it.price;
    it.price = meta.price; it.currency = meta.currency || it.currency || 'EUR';
    it.priceCheckedAt = Date.now(); pushHistory(it);
  }
  cleanupGroups(); markDirty(); renderView(); refreshGroupSheet();
  if (meta.offline) {
    toast(isPreview() ? 'In der Vorschau sind Online-Abrufe gesperrt – öffne die App auf dem iPhone.' : 'Keine Verbindung zu den Abrufdiensten', { duration: 7000, action: { label: 'Testen', run: testConnection } });
  } else if (meta.guessed || (!meta.title && !meta.image)) {
    toast('Der Shop blockiert das Auslesen – mit dem Helfer klappt es trotzdem.', { duration: 8000, action: { label: 'Helfer', run: showHelper } });
  } else if (isNew && suggestGroup(it)) {
    /* Vergleichsvorschlag wird angezeigt */
  } else if (it.price == null) {
    toast('Preis nicht gefunden – der Helfer liest ihn direkt aus der Seite', { duration: 7000, action: { label: 'Helfer', run: showHelper } });
  } else if (force) toast('Daten aktualisiert', { icon: 'check' });
}
function applyGrab(text, ctx = {}) {
  let d;
  try { d = JSON.parse(text.slice(text.indexOf(':') + 1)); } catch { toast('Helfer-Daten konnten nicht gelesen werden'); return; }
  const url = normalizeUrl(d.u || ''); if (!url) return;
  const site = cleanSite(d.s, url);
  const data = {
    title: cleanTitle(String(d.t || '').replace(/\s+/g, ' ').trim(), site),
    image: d.i ? upgradeImage(d.i) : '', imageOrig: d.i || '',
    price: parsePrice(d.p), currency: (d.c || 'EUR').toUpperCase().slice(0, 3),
    site, logo: d.l || ''
  };
  let it = state.items.find(i => canonUrl(i.url) === canonUrl(url));
  const isNew = !it;
  const g = ctx.groupId && groupById(ctx.groupId);
  if (isNew) {
    it = { id: uid(), type: 'link', url, note: '', priority: g ? g.priority : (ctx.priority || 'next'), status: 'wish', groupId: g ? g.id : null, createdAt: Date.now() };
    state.items.unshift(it);
  }
  const old = it.price;
  for (const [k, v] of Object.entries(data)) if (v != null && v !== '') it[k] = v;
  if (!isNew && old != null && it.price != null && Math.abs(old - it.price) >= 0.01) it.lastPrice = old;
  if (data.price != null) { it.priceCheckedAt = Date.now(); pushHistory(it); }
  it.titleGuessed = false; delete it.loading;
  if (isNew && !g) { ui.tab = 'wishes'; ui.seg = it.priority; scrollTo(0, 0); }
  commit();
  toast(isNew ? 'Produkt hinzugefügt' : 'Eintrag mit Shop-Daten aktualisiert', { icon: 'check' });
  if (isNew && !g) setTimeout(() => { if (wishes()[0] === it) suggestGroup(it); }, 1600);
}

/* ---------- Preis-Check ---------- */
async function checkPrices() {
  if (ui.checking) return;
  const list = wishes().filter(i => i.url && !i.loading);
  if (!list.length) { toast('Keine Wünsche zum Prüfen'); return; }
  ui.checking = { done: 0, total: list.length };
  renderView(true);
  const down = [], up = [];
  let fail = 0;
  const queue = [...list];
  const worker = async () => {
    while (queue.length) {
      const it = queue.shift();
      let meta = {};
      try { meta = await fetchMeta(it.url); } catch {}
      if (state.items.includes(it)) {
        if (meta.price != null) {
          if (it.price != null && Math.abs(meta.price - it.price) >= 0.01) { (meta.price < it.price ? down : up).push({ it, from: it.price }); it.lastPrice = it.price; }
          it.price = meta.price;
          if (meta.currency) it.currency = meta.currency;
          it.priceCheckedAt = Date.now(); pushHistory(it);
          if (!it.image && meta.image) { it.image = meta.image; it.imageOrig = meta.imageOrig; }
        } else fail++;
      }
      ui.checking.done++;
      const pill = $('[data-act=check]');
      if (pill) pill.innerHTML = `<span class="spin"></span>${ui.checking.done}/${ui.checking.total}`;
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  ui.checking = null;
  state.lastPriceCheck = Date.now();
  markDirty(); renderView(true); refreshGroupSheet();
  const hits = wishes().filter(isHit);
  const row = (x, cls) => `<div class="row"><span class="lbl" style="font-size:14.5px">${esc(short(x.it.title, 34))}</span><span class="chg ${cls}">${esc(fmtPrice(x.from, x.it.currency))} → ${esc(fmtPrice(x.it.price, x.it.currency))}</span></div>`;
  const changes = [...down.map(x => row(x, 'down')), ...up.map(x => row(x, 'up'))].join('');
  modal({
    title: 'Preis-Check fertig', wide: true,
    text: `${down.length} günstiger · ${up.length} teurer · ${list.length - fail - down.length - up.length} unverändert${hits.length ? ` · ${hits.length} unter Wunschpreis` : ''}`,
    body: (changes ? `<div class="glist" style="margin-top:16px">${changes}</div>` : '') +
      (fail ? `<p class="drop-hint" style="margin-top:14px">${fail} ${fail === 1 ? 'Preis konnte' : 'Preise konnten'} nicht ermittelt werden – meist blockiert der Shop. Mit dem Helfer (Kurzbefehl) aktualisierst du sie direkt auf der Shopseite.</p>` : ''),
    actions: [{ label: 'OK', value: true, cls: 'btn-blue' }]
  });
}
function openHits() {
  const list = wishes().filter(isHit);
  sheet({
    title: 'Unter Wunschpreis',
    body: `<div class="pick">${list.map(it => `<button class="mini" data-hit="${it.id}">${mediaHTML(it, 'sm')}<div class="card-body"><div class="title">${esc(it.title || hostOf(it.url))}</div><div class="sub">${esc(fmtPrice(it.price, it.currency))} · Ziel ${esc(fmtPrice(it.targetPrice, it.currency))}</div></div>${icon('chevronRight', 16)}</button>`).join('')}</div>`,
    onOpen: api => api.body.addEventListener('click', e => { const b = e.target.closest('[data-hit]'); if (b) openItem(byId(b.dataset.hit)); })
  });
}

/* ---------- Notizen ---------- */
function addNote(text = '') {
  const n = { id: uid(), text, createdAt: Date.now(), updatedAt: Date.now() };
  state.notes.unshift(n);
  markDirty();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  ui.tab = 'notes'; scrollTo(0, 0); renderView(true);
  if (!text) { const t = $(`.note[data-id="${n.id}"] textarea`); if (t) t.focus(); }
  else toast('Notiz hinzugefügt', { icon: 'check' });
}
function delNote(id) {
  const s = snap();
  state.notes = state.notes.filter(n => n.id !== id);
  commit();
  toast('Notiz gelöscht', { action: { label: 'Widerrufen', run: () => restore(s) } });
}

/* ---------- Einstellungen, Import, Export ---------- */
function openSettings() {
  const row = (k, ic, label) => `<button class="row" data-s="${k}">${icon(ic, 18)}<span class="lbl">${label}</span>${icon('chevronRight', 15)}</button>`;
  const stat = (label, n) => `<div class="row"><span class="lbl">${label}</span><span class="sub" style="font-size:15px">${n}</span></div>`;
  const body = `
    <div class="set-status glass ${ui.status.dirty ? 'dirty' : ''}" id="setStatus"><span class="dot"></span><span class="txt">${esc(ui.status.text)}</span></div>
    <div class="section-title"><span>Daten</span></div>
    <div class="glist">
      ${row('save', 'download', HOSTED ? 'Exportieren (alle Einträge)' : 'Speichern')}
      ${!HOSTED && window.showSaveFilePicker ? row('saveas', 'saveas', 'Speichern unter …') : ''}
      ${row('json', 'download', 'Backup als JSON')}
      ${row('import', 'upload', 'Importieren')}
    </div>
    <div class="section-title"><span>Einrichtung & Hilfe</span></div>
    <div class="glist">
      ${row('helper', 'plus', IS_IOS ? 'Helfer für iPhone (Kurzbefehl)' : 'Browser-Helfer (Lesezeichen)')}
      ${row('iphone', 'iphone', 'Als iPhone-App nutzen')}
      ${row('test', 'pulse', 'Verbindung testen')}
    </div>
    <div class="section-title"><span>Übersicht</span></div>
    <div class="glist">${stat('Wünsche', wishes().length)}${stat('Vergleiche', state.groups.length)}${stat('Gekauft', state.items.filter(i => i.status === 'bought').length)}${stat('Notizen', state.notes.length)}</div>
    <div class="glist" style="margin-top:22px"><button class="row danger" data-s="clear">${icon('trash', 18)}<span class="lbl">Alle Einträge löschen</span></button></div>
    <p class="foot-note">${HOSTED ? 'Einträge werden automatisch auf diesem Gerät gesichert. Zum Übertragen exportieren und auf dem anderen Gerät importieren.' : 'Alle Einträge werden in dieser HTML-Datei gespeichert.'}</p>`;
  sheet({
    title: 'Einstellungen', body,
    onOpen: api => api.body.addEventListener('click', e => {
      const r = e.target.closest('[data-s]'); if (!r) return;
      ({ save: () => save(), saveas: () => save(true), json: exportJSON, import: importFile, helper: showHelper, iphone: showIPhoneSetup, test: testConnection, clear: clearAll })[r.dataset.s]();
    })
  });
}
function exportJSON() {
  const txt = JSON.stringify(cleanData(), null, 2);
  shareFile(txt, 'wunschliste-backup.json', 'application/json').then(r => {
    if (r === 'abort') return;
    if (!r) download(txt, 'wunschliste-backup.json', 'application/json');
    toast('Backup exportiert', { icon: 'check' });
  });
}
function importFile() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,.html,.htm,application/json,text/html';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let data;
    try {
      const txt = await f.text();
      if (/\.html?$/i.test(f.name) || /^\s*</.test(txt)) data = JSON.parse(new DOMParser().parseFromString(txt, 'text/html').querySelector('#wishlist-data').textContent);
      else data = JSON.parse(txt);
      if (!Array.isArray(data.items)) throw 0;
      data = migrate(data);
    } catch { toast('Datei konnte nicht gelesen werden'); return; }
    const choice = await modal({
      title: 'Daten importieren',
      text: `${data.items.length} Produkte, ${data.groups.length} Vergleiche und ${data.notes.length} Notizen gefunden. Zusammenführen oder alles ersetzen?`,
      actions: [{ label: 'Abbrechen', value: false }, { label: 'Alles ersetzen', value: 'replace', cls: 'btn-danger' }, { label: 'Zusammenführen', value: 'merge', cls: 'btn-blue' }]
    });
    if (!choice) return;
    if (choice === 'replace') { state.items = data.items; state.groups = data.groups; state.notes = data.notes; }
    else {
      const ids = new Set(state.items.map(i => i.id)), urls = new Set(state.items.map(i => canonUrl(i.url)));
      const gids = new Set(state.groups.map(g => g.id)), nids = new Set(state.notes.map(n => n.id));
      state.items.push(...data.items.filter(i => !ids.has(i.id) && !urls.has(canonUrl(i.url))));
      state.groups.push(...data.groups.filter(g => !gids.has(g.id)));
      state.notes.push(...data.notes.filter(n => !nids.has(n.id)));
    }
    commit();
    toast('Import abgeschlossen', { icon: 'check' });
  };
  inp.click();
}
async function clearAll() {
  const ok = await modal({
    title: 'Alle Einträge löschen?',
    text: 'Alle Wünsche, Vergleiche, Käufe und Notizen werden entfernt.',
    actions: [{ label: 'Abbrechen', value: false }, { label: 'Alles löschen', value: true, cls: 'btn-danger' }]
  });
  if (!ok) return;
  state.items = []; state.groups = []; state.notes = [];
  sheets.slice().forEach(s => s.close());
  commit();
}
/* ---------- Ereignisse ---------- */
const view = $('#view');
view.addEventListener('click', e => {
  if (Date.now() - lastSwipeAt < 350) { e.preventDefault(); return; }
  const t = e.target;
  if (t.closest('a')) return;
  const seg = t.closest('[data-seg]');
  if (seg) { ui.seg = seg.dataset.seg; renderView(true); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act, it = act.dataset.id && byId(act.dataset.id);
    if (a === 'check') checkPrices();
    else if (a === 'hits') openHits();
    else if (a === 'toggle-disc') { ui.showDiscarded = !ui.showDiscarded; renderView(true); }
    else if (a === 'restore' && it) restoreDiscarded(it);
    else if (a === 'purge' && it) deleteItem(it);
    else if (a === 'del-note') delNote(act.closest('.note').dataset.id);
    return;
  }
  const op = t.closest('[data-open]'); if (!op) return;
  if (op.dataset.open === 'item') openItem(byId(op.dataset.id));
  else if (op.dataset.open === 'group') openGroup(groupById(op.dataset.id));
  else if (op.dataset.open === 'note') {
    ui.tab = 'notes'; renderView(true);
    const ta = $(`.note[data-id="${op.dataset.id}"] textarea`); if (ta) ta.focus();
  }
});
view.addEventListener('input', e => {
  const ta = e.target.closest && e.target.closest('.note textarea');
  if (ta) {
    const n = state.notes.find(x => x.id === ta.closest('.note').dataset.id);
    if (n) { n.text = ta.value; n.updatedAt = Date.now(); autosize(ta); markDirty(); }
    return;
  }
  if (e.target.id === 'searchInput') { ui.query = e.target.value; const r = $('#searchResults'); r.innerHTML = searchResults(); bindSwipes(r); }
});
view.addEventListener('focusout', e => {
  const ta = e.target.closest && e.target.closest('.note textarea'); if (!ta) return;
  const el = ta.closest('.note'), n = state.notes.find(x => x.id === el.dataset.id);
  if (n && !n.text.trim()) { state.notes = state.notes.filter(x => x !== n); markDirty(); setTimeout(() => { if (ui.tab === 'notes') renderView(true); }, 0); }
  else if (n) { const w = el.querySelector('.when'); if (w) w.textContent = fmtDate(n.updatedAt); }
});
view.addEventListener('keydown', e => { if (e.target.id === 'searchInput' && e.key === 'Enter') e.target.blur(); });

function switchTab(t) {
  if (ui.tab === t) { scrollTo({ top: 0, behavior: 'smooth' }); return; }
  ui.tab = t; scrollTo(0, 0); renderView(true);
  if (t === 'search') { const i = $('#searchInput'); if (i) i.focus(); }
}
$$('[data-tab]').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
$('#addBtn').addEventListener('click', () => { if (ui.tab === 'notes') addNote(''); else openAdd({}); });
$('#gearBtn').addEventListener('click', openSettings);
addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', scrollY > 40), { passive: true });

/* Tab-Leiste ausblenden, solange die Tastatur offen ist */
document.addEventListener('focusin', e => { if (IS_TOUCH && e.target.matches && e.target.matches('input:not([type=file]):not([type=date]),textarea')) document.body.classList.add('kb'); });
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!a || !a.matches || !a.matches('input,textarea')) document.body.classList.remove('kb'); }, 50));

/* Einfügen: Helfer-Daten oder Links (auch in Eingabefeldern) */
document.addEventListener('paste', e => {
  const t = (e.clipboardData.getData('text') || '').trim();
  if (t.startsWith('WUNSCHLISTE:')) {
    e.preventDefault();
    if (addRef) { const ctx = addRef.ctx; addRef.api.close(); applyGrab(t, ctx); } else applyGrab(t, {});
    return;
  }
  if (e.target.closest && e.target.closest('input,textarea,[contenteditable]')) return;
  if (looksUrl(t)) { const u = normalizeUrl(t); if (u) { e.preventDefault(); addLink(u, { priority: ui.tab === 'wishes' ? ui.seg : 'next' }); } }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  else if (e.key === 'Escape' && sheets.length && !$('#overlay').classList.contains('open')) sheets[sheets.length - 1].close();
});
addEventListener('beforeunload', e => { if (dirty && !HOSTED) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Start ---------- */
makeAppIcon();
if (isPreview()) $('#bannerSlot').innerHTML = '<div class="preview-banner">Vorschau-Modus: Laden von Produktdaten und Speichern sind hier gesperrt. Öffne die App auf dem iPhone oder lade die Datei herunter.</div>';
(async () => {
  HOSTED = /^https?:$/.test(location.protocol) && !isPreview() && 'indexedDB' in window;
  if (HOSTED) {
    try {
      const saved = await DB.get('state');
      const embeddedHas = state.items.length + state.notes.length > 0;
      if (saved && Array.isArray(saved.items) && (!embeddedHas || new Date(saved.savedAt || 0) >= new Date(state.savedAt || 0))) {
        const m = migrate(saved);
        state.items = m.items; state.groups = m.groups; state.notes = m.notes; state.lastPriceCheck = m.lastPriceCheck || null;
      } else if (embeddedHas) await DB.set('state', cleanData());
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    } catch {
      HOSTED = false;
      toast('Speichern auf dem Gerät nicht möglich (privater Modus?) – bitte regelmäßig exportieren', { duration: 6000 });
    }
  }
  cleanupGroups();
  renderView(true);
  const total = state.items.length + state.notes.length;
  setStatus(HOSTED ? 'Auf diesem Gerät gesichert' : (total ? `${total} Einträge geladen` : 'Bereit'), false);
})();
})();
</script>
